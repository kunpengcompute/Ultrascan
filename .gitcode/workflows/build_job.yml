name: Build Job

on:
  workflow_call:
    inputs:
      runs_on_flavor:
        required: true
        type: string
      docker_img:
        required: true
        type: string
      pr_id:
        required: true
        type: string
      branch:
        required: true
        type: string

jobs:
  JOB_Compile:
    name: Compile
    select: selected_by_default
    runs-on: [ self-hosted, os=euler, arch=arm64, type=pr, "${{ inputs.runs_on_flavor }}" ]
    container:
      image: ${{ inputs.docker_img }}
    steps:
      - name: fast_checkout
        identifier: fast_checkout
        uses: checkout
        with:
          # fork PR 预合并引用会被安全拦截，需显式放行（pwn request 防护）
          allow-unsafe-pr-checkout: true
          ref: refs/merge-requests/${{ inputs.pr_id }}/merge
      - name: checkout_default_scripts
        uses: checkout
        with:
          # 基分支脚本回退：预合入代码中可能没有 .gitcode/scripts/ 脚本（尚未合入基分支）
          ref: ${{ inputs.branch }}
          path: base-scripts
      - name: build
        run: |-
          if [ -f .gitcode/scripts/build_ci.sh ]; then
            sh .gitcode/scripts/build_ci.sh                # 预合入代码自带 → 用它
          elif [ -f base-scripts/.gitcode/scripts/build_ci.sh ]; then
            sh base-scripts/.gitcode/scripts/build_ci.sh   # 缺失 → 用基分支副本
          else
            echo "ERROR: build_ci.sh 在预合入代码和基分支中均不存在"; exit 1
          fi
      - name: upload build artifacts
        uses: upload-artifact
        with:
          name: ultrascan-build
          path: build/
          retention-days: 1    # 制品仅当次运行内消费(build→ut)，命名空间配额1GiB，1天后自动清理避免占满
